# Lets anyone with write access summon Claude by writing @claude in an issue,
# a pull request, or a review comment.
#
# Two things have to be set up outside this file, and neither can be automated:
#
#   1. The Claude GitHub App installed on this repository —
#      https://github.com/apps/claude — with Contents, Issues and Pull requests
#      set to read & write.
#   2. An ANTHROPIC_API_KEY repository secret, under
#      Settings → Secrets and variables → Actions.
#
# Without the secret the job starts and fails on authentication rather than
# doing nothing, so a silent no-op means the `if:` below did not match.
#
# Costs run on two meters: GitHub Actions minutes for the runner, and Anthropic
# API tokens for the conversation. Both are per invocation.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Gate on the mention BEFORE spinning up a runner. Without this every
    # comment on the repository would start a job and pay for a checkout.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read CI results when asked about a failing PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # --max-turns was 15, and every run died on "Reached maximum number
          # of turns" after correctly diagnosing the issue and starting the
          # edit. Reading a repo this size, changing several files, running the
          # suite, committing and opening a PR does not fit in 15 turns, and a
          # run that stops halfway costs the same tokens as one that finishes
          # while producing nothing.
          #
          # Edit/Write/MultiEdit are listed explicitly. --allowedTools is a
          # replacement rather than an addition, so naming only the Bash
          # entries would leave Claude able to read the repository and unable
          # to change it — which fails in a way that looks like the model
          # giving up rather than a misconfiguration.
          #
          # The unit suite runs on a bare runner and is the fast signal on any
          # derivation change. The Quench suite is deliberately absent: it
          # needs a licensed Foundry server and a live world, so offering it
          # would produce confident failures rather than useful ones.
          claude_args: |
            --max-turns 40
            --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Bash(npm test),Bash(npm install),Bash(node tools/build-release.mjs),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git status:*),Bash(git diff:*)"
